spring.application.name=MovieTicketBooking
spring.profiles.active=dev
api.prefix=/api
server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Refresh Token hết hạn sau 7 ngày (ms)
jwt.refresh-expiration=604800000

# CORS Configuration (thêm origins production khi deploy)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174,http://127.0.0.1:5173

# Rate Limiting Configuration
rate.limit.requests=50
rate.limit.window=60

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Redis Configuration
spring.data.redis.host={REDIS_HOST}
spring.data.redis.port=6379
spring.cache.type=redis

# Stripe Payment Gateway Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
