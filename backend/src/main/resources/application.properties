spring.application.name=MovieTicketBooking
api.prefix=/api

# JWT Configuration
jwt.secret=your-very-long-and-secure-secret-key-at-least-32-characters-long-123456
jwt.expiration=86400000

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
