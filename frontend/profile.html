<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Cá Nhân - CinePrime</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Shared Header -->
  <header id="main-header"></header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- User Profile Header Card -->
    <div class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl flex flex-col sm:flex-row items-center gap-6">
      <img id="profile-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-rose-500/80 shadow-xl shadow-rose-950/40">
      
      <div class="space-y-2 text-center sm:text-left flex-1">
        <span class="text-xs uppercase font-extrabold tracking-wider text-rose-400 bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/20">
          <i class="fa-solid fa-user-shield mr-1"></i> Tài Khoản Thành Viên VIP
        </span>
        <h1 id="profile-username" class="text-2xl sm:text-3xl font-black text-white">---</h1>
        <div class="flex items-center justify-center sm:justify-start gap-4 text-xs text-slate-400 flex-wrap">
          <span class="flex items-center gap-1.5">
            <i class="fa-regular fa-envelope text-rose-500"></i> <span id="profile-email">---</span>
          </span>
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-phone text-rose-500"></i> <span id="profile-phone">---</span>
          </span>
        </div>
      </div>

      <a href="index.html" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition-colors">
        <i class="fa-solid fa-film mr-1"></i> Khám phá phim mới
      </a>
    </div>

    <!-- Two Columns Grid: Booking History & Password Change -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Column: Booking History (2 Cols) -->
      <div class="lg:col-span-2 space-y-6">
        <h2 class="text-lg font-bold text-white border-l-4 border-rose-500 pl-3 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-rose-500"></i>
          <span>Lịch Sử Đặt Vé Xem Phim</span>
        </h2>

        <!-- Bookings List Container -->
        <div id="booking-history-container" class="space-y-4">
          <!-- Populated via profile.js -->
        </div>
      </div>

      <!-- Right Column: Change Password Form (1 Col) -->
      <div class="space-y-6">
        <h2 class="text-lg font-bold text-white border-l-4 border-rose-500 pl-3 flex items-center gap-2">
          <i class="fa-solid fa-key text-rose-500"></i>
          <span>Đổi Mật Khẩu</span>
        </h2>

        <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 space-y-4">
          <form id="change-password-form" class="space-y-4">
            <!-- Alert Message Container -->
            <div id="pw-alert" class="hidden p-3 rounded-xl text-xs font-medium"></div>

            <div class="space-y-1">
              <label for="current-password" class="text-xs font-semibold text-slate-300">Mật khẩu hiện tại</label>
              <input 
                type="password" 
                id="current-password" 
                placeholder="Nhập mật khẩu cũ" 
                required 
                class="w-full bg-slate-950 text-white text-xs rounded-xl border border-slate-800 px-3 py-2.5 outline-none focus:border-rose-500 transition-all"
              />
            </div>

            <div class="space-y-1">
              <label for="new-password" class="text-xs font-semibold text-slate-300">Mật khẩu mới</label>
              <input 
                type="password" 
                id="new-password" 
                placeholder="Tối thiểu 6 ký tự" 
                required 
                class="w-full bg-slate-950 text-white text-xs rounded-xl border border-slate-800 px-3 py-2.5 outline-none focus:border-rose-500 transition-all"
              />
            </div>

            <div class="space-y-1">
              <label for="confirm-new-password" class="text-xs font-semibold text-slate-300">Xác nhận mật khẩu mới</label>
              <input 
                type="password" 
                id="confirm-new-password" 
                placeholder="Nhập lại mật khẩu mới" 
                required 
                class="w-full bg-slate-950 text-white text-xs rounded-xl border border-slate-800 px-3 py-2.5 outline-none focus:border-rose-500 transition-all"
              />
            </div>

            <button 
              type="submit" 
              id="pw-submit-btn" 
              class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Lưu Mật Khẩu Mới</span>
            </button>
          </form>
        </div>
      </div>

    </div>

  </main>

  <!-- Shared Footer -->
  <footer id="main-footer"></footer>

  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
