<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Cá Nhân - CinePrime</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Shared Header -->
  <header id="main-header"></header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    
    <!-- User Profile Header Card -->
    <div class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl flex flex-col sm:flex-row items-center gap-6">
      <img id="profile-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-rose-500/80 shadow-xl shadow-rose-950/40">
      
      <div class="space-y-2 text-center sm:text-left flex-1">
        <span class="text-xs uppercase font-extrabold tracking-wider text-rose-400 bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/20">
          <i class="fa-solid fa-user-shield mr-1"></i> Tài Khoản Thành Viên VIP
        </span>
        <h1 id="profile-username" class="text-2xl sm:text-3xl font-black text-white">---</h1>
        <div class="flex items-center justify-center sm:justify-start gap-4 text-xs text-slate-400 flex-wrap">
          <span class="flex items-center gap-1.5">
            <i class="fa-regular fa-envelope text-rose-500"></i> <span id="profile-email">---</span>
          </span>
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-phone text-rose-500"></i> <span id="profile-phone">---</span>
          </span>
        </div>
      </div>

      <a href="index.html" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition-colors">
        <i class="fa-solid fa-film mr-1"></i> Khám phá phim mới
      </a>
    </div>

    <!-- Booking History Section -->
    <div class="space-y-6">
      <h2 class="text-xl font-extrabold text-white border-l-4 border-rose-500 pl-4 flex items-center gap-2">
        <i class="fa-solid fa-receipt text-rose-500"></i>
        <span>Lịch Sử Đặt Vé Xem Phim</span>
      </h2>

      <!-- Bookings List Container -->
      <div id="booking-history-container" class="space-y-4">
        <!-- Populated via profile.js -->
      </div>
    </div>

  </main>

  <!-- Shared Footer -->
  <footer id="main-footer"></footer>

  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
