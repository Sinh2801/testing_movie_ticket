<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Phim - CinePrime</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Shared Header -->
  <header id="main-header"></header>

  <!-- Main Content Container for Movie Details -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="movie-detail-container">
      <!-- Loading Skeleton -->
      <div class="animate-pulse space-y-6">
        <div class="h-80 bg-slate-900 rounded-3xl"></div>
        <div class="h-10 w-1/3 bg-slate-900 rounded-xl"></div>
        <div class="h-20 bg-slate-900 rounded-2xl"></div>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="main-footer"></footer>

  <script type="module" src="js/pages/movieDetail.js"></script>
</body>
</html>
