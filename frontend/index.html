<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePrime - Hệ Thống Đặt Vé Xem Phim Trực Tuyến</title>
  <meta name="description" content="Đặt vé xem phim chiếu rạp nhanh chóng, tiện lợi với trải nghiệm điện ảnh đỉnh cao tại CinePrime. Xem 10 phim mới nhất ngay!">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Shared Header Component Container -->
  <header id="main-header"></header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    
    <!-- Hero Banner Section -->
    <section id="hero-banner-container"></section>

    <!-- Movies Section Header -->
    <section class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-slate-800/80 pb-4">
        <div>
          <h2 id="section-title" class="text-2xl sm:text-3xl font-black text-white tracking-wide border-l-4 border-rose-500 pl-4">
            Top 10 Phim Mới Nhất Chiếu Rạp
          </h2>
          <p id="result-info" class="text-slate-400 text-xs sm:text-sm mt-1 pl-4">
            Danh sách 10 phim đang gây bão phòng vé tuần này
          </p>
        </div>
        
        <div class="flex items-center gap-2 text-xs font-semibold text-rose-400 bg-rose-500/10 px-3 py-1.5 rounded-full border border-rose-500/20 self-start sm:self-auto">
          <i class="fa-solid fa-sparkles"></i>
          <span>Cập nhật liên tục 24/7</span>
        </div>
      </div>

      <!-- 10 Movies Grid Container -->
      <div id="movie-list-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
        <!-- Movies populated dynamically via js/pages/home.js -->
      </div>
    </section>

  </main>

  <!-- Shared Footer Component Container -->
  <footer id="main-footer"></footer>

  <!-- Main Page Logic ES6 Module -->
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
