<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản - CinePrime</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Shared Header -->
  <header id="main-header"></header>

  <!-- Main Register Section -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl shadow-rose-950/20 space-y-6">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-600 to-pink-600 p-0.5 shadow-lg shadow-rose-600/30 mx-auto mb-3">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
            <i class="fa-solid fa-user-plus text-rose-500 text-xl"></i>
          </div>
        </div>
        <h1 class="text-2xl font-black text-white">Đăng Ký Tài Khoản</h1>
        <p class="text-slate-400 text-xs">Tạo tài khoản để bắt đầu trải nghiệm xem phim đỉnh cao</p>
      </div>

      <!-- Alert Message Box -->
      <div id="alert-box" class="hidden p-3.5 rounded-xl border text-xs font-semibold flex items-center"></div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-4">
        
        <!-- Username Input -->
        <div class="space-y-1.5">
          <label for="username" class="text-xs font-semibold text-slate-300">Tên người dùng (Username)</label>
          <div class="relative">
            <input 
              type="text" 
              id="username" 
              placeholder="nguyenvana" 
              required 
              class="w-full bg-slate-950 text-white text-sm rounded-xl border border-slate-800 pl-10 pr-4 py-3 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all"
            />
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
        </div>

        <!-- Email Input -->
        <div class="space-y-1.5">
          <label for="email" class="text-xs font-semibold text-slate-300">Địa chỉ Email</label>
          <div class="relative">
            <input 
              type="email" 
              id="email" 
              placeholder="user@example.com" 
              required 
              class="w-full bg-slate-950 text-white text-sm rounded-xl border border-slate-800 pl-10 pr-4 py-3 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all"
            />
            <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
        </div>

        <!-- Phone Number Input -->
        <div class="space-y-1.5">
          <label for="phone" class="text-xs font-semibold text-slate-300">Số điện thoại (Phone Number)</label>
          <div class="relative">
            <input 
              type="tel" 
              id="phone" 
              placeholder="0912345678" 
              required 
              class="w-full bg-slate-950 text-white text-sm rounded-xl border border-slate-800 pl-10 pr-4 py-3 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all"
            />
            <i class="fa-solid fa-phone absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <label for="password" class="text-xs font-semibold text-slate-300">Mật khẩu (Password)</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              placeholder="Tối thiểu 6 ký tự" 
              required 
              class="w-full bg-slate-950 text-white text-sm rounded-xl border border-slate-800 pl-10 pr-4 py-3 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all"
            />
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="space-y-1.5">
          <label for="confirm-password" class="text-xs font-semibold text-slate-300">Xác nhận mật khẩu (Confirm Password)</label>
          <div class="relative">
            <input 
              type="password" 
              id="confirm-password" 
              placeholder="Nhập lại mật khẩu" 
              required 
              class="w-full bg-slate-950 text-white text-sm rounded-xl border border-slate-800 pl-10 pr-4 py-3 outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-all"
            />
            <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submit-btn" 
          class="w-full py-3.5 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-rose-600/30 hover:shadow-rose-600/50 transition-all duration-300 flex items-center justify-center gap-2 mt-2"
        >
          <span>Tạo Tài Khoản</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>

      </form>

      <!-- Login Link -->
      <div class="text-center text-xs text-slate-400 pt-4 border-t border-slate-800">
        Bạn đã có tài khoản? 
        <a href="login.html" class="text-rose-400 font-bold hover:underline ml-1">Đăng nhập ngay</a>
      </div>

    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="main-footer"></footer>

  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
